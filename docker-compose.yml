version: '3.8'

services:
  postgres-pgvector:
    image: pgvector/pgvector:pg16
    container_name: kpss_super_brain_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kpss_brain}
      POSTGRES_USER: ${POSTGRES_USER:-kpss_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kpss_secret_password_2026}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
      - ./data/init_pgvector.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kpss_user -d kpss_brain"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgvector_data:
    driver: local
